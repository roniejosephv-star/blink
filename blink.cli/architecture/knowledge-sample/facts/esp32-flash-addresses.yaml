type: fact
id: fact/esp32-flash-addresses
category: firmware-quirk
summary: "ESP32 flash start addresses differ by chip family"
chips:
  - esp32
  - esp32s2
  - esp32s3
  - esp32c3
  - esp32c6
  - esp32c2
related_errors:
  - error/flash-failed-wrong-address
detail: |
  Each ESP32 chip family has a different default flash start address for
  MicroPython / CircuitPython / Arduino firmware. Using the wrong address
  will brick the device (the bootloader will not find the firmware).

  The mapping:

  | Chip family   | Flash start address | Why |
  |---------------|---------------------|-----|
  | esp32         | 0x1000              | Bootloader is 0x1000, app starts at 0x10000 |
  | esp32s2       | 0x1000              | Same as esp32 (older architecture) |
  | esp32s3       | 0x0                 | Newer architecture, bootloader at 0x0 |
  | esp32c3       | 0x0                 | RISC-V, bootloader at 0x0 |
  | esp32c6       | 0x0                 | RISC-V, bootloader at 0x0 |
  | esp32c2       | 0x0                 | RISC-V, smaller variant |
  | esp8266       | 0x0                 | Legacy, bootloader at 0x0 |

  The error of using the wrong address typically manifests as:
  - "Invalid magic byte" errors from esptool
  - The device boots into a loop (eternal "ets Jul 29 2019..." messages)
  - The serial monitor shows garbage instead of the MicroPython REPL

  The fix: always run esptool chip_id first to identify the chip family,
  then use the correct address. Most tools (esptool.py, esptool.rs) do this
  automatically when given just the firmware file and the chip type.
sources:
  - "https://docs.espressif.com/projects/esptool/en/latest/esp32/esptool/basic-options.html"
  - "https://micropython.org/download/"
verified_at: "2026-08-12"
contributed_by: "@ronie"
