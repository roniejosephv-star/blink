type: pattern
id: pattern/micropython-i2c-driver
category: code-pattern
summary: "The standard way to write an I2C device driver in MicroPython"
detail: |
  Every MicroPython I2C driver follows the same skeleton. This is the
  canonical pattern; deviating from it is a code smell.

  The pattern is:
  1. Constructor takes the I2C bus and the device address
  2. Optional: probe() to verify the device is responding
  3. Methods that wrap _read() and _write() with the device's register map
  4. Constants for the register addresses and expected values
  5. Properties for higher-level state (temperature, humidity, etc.)

  Example skeleton (for a BME280-like sensor):

  ```python
  from machine import I2C
  from micropython import const

  class BME280:
      # Register map (from the datasheet)
      REG_CHIP_ID = const(0xD0)
      REG_TEMP = const(0xFA)
      REG_CTRL = const(0xF4)

      CHIP_ID_EXPECTED = const(0x60)

      def __init__(self, i2c, address=0x76):
          self._i2c = i2c
          self._address = address
          self._buffer = bytearray(3)  # pre-allocated for read

      def probe(self):
          chip_id = self._read_register(self.REG_CHIP_ID, 1)[0]
          if chip_id != self.CHIP_ID_EXPECTED:
              raise OSError(f"Unexpected chip ID: 0x{chip_id:02x}")

      def _read_register(self, reg, length):
          return self._i2c.readfrom_mem(self._address, reg, length)

      def _write_register(self, reg, value):
          self._i2c.writeto_mem(self._address, reg, bytes([value]))

      @property
      def temperature(self):
          data = self._read_register(self.REG_TEMP, 3)
          # Apply calibration (sensor-specific)
          raw = (data[0] << 12) | (data[1] << 4) | (data[2] >> 4)
          return raw / 5120.0  # Simplified — see datasheet for full compensation
  ```

  Key principles:
  - Pre-allocate the read buffer (avoids allocation in the hot path)
  - Use micropython.const for register addresses (saves RAM)
  - Never allocate a bytes/bytearray in a hot method
  - Use properties for derived values, methods for actions
  - Always include a probe() / chip_id check
