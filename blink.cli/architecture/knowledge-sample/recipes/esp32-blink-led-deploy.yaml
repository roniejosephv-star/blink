type: recipe
id: recipe/esp32-blink-led-deploy
name: esp32-blink-led-deploy
summary: "Flash MicroPython to a fresh ESP32 and deploy the blink-led example"
description: "Flash MicroPython to a fresh ESP32 (or ESP32-S3) and deploy the blink-led example. Beginner-friendly, covers the most common first-time setup."
tags:
  - esp32
  - micropython
  - beginner
  - getting-started
setup:
  requires_plugin: "tinkr-esp32@^1.2"
  requires_device_family: "esp32"
  requires_firmware: "micropython"
steps:
  - name: scan-ports
    run: tinkr-esp32-port-scan
    capture: ports
  - name: identify-device
    run: tinkr-esp32-identify
    args:
      port: "$ports.devices.0.port"
    capture: device
  - name: fetch-firmware
    run: blink-firmware-fetch
    args:
      board: "$device.board"
      firmware_type: micropython
      output: "/tmp/firmware-$device.chip.bin"
    capture: firmware
  - name: flash-firmware
    run: tinkr-esp32-flash-firmware
    args:
      port: "$device.port"
      firmware: "$firmware.path"
      erase: true
    on_error: abort
  - name: wait-for-reboot
    run: sleep
    args:
      seconds: 3
  - name: deploy-blink-led
    run: blink project deploy
    args:
      project: "./blink-led"
      device: "$device.id"
  - name: monitor-serial
    run: blink monitor
    args:
      port: "$device.port"
      duration: "10s"
contributed_by: "@ronie"
contributed_at: "2026-08-12T14:32:00Z"
