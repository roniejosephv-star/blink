# Example tinkr.toml for the tinkr-led project.
# This shows how the project-as-memory design works in practice.

[project]
name = "tinkr-led"
description = "Hello world: tinkr the onboard LED on an ESP32 board."
version = "0.1.0"
authors = ["Ronie Joseph <ronie@example.com>"]
license = "MIT"

[targets]
# Set this after `tinkr device scan` to the actual device ID.
default = "esp32s3-left"
boards = ["ESP32-S3-DevKitC-1", "ESP32-DevKitC"]
families = ["esp32s3", "esp32"]
firmware = "micropython"

[plugins]
tinkr-esp32 = "^1.2"

[plugins.tinkr-esp32]
# Use the onboard LED pin for the S3-DevKitC-1 (GPIO48) by default.
# The example main.py uses GPIO2; change it if you're on a different board.
default_baud = 460800
flash_mode = "dio"

[knowledge]
notes = [
    "README.md",  # This file is also a knowledge reference for the agent.
]

[dependencies]
# No device packages needed for tinkr-led.

[devices."esp32s3-left"]
nickname = "kitchen sensor ESP32-S3"
notes = "The onboard RGB LED is on GPIO48. Change LED_PIN in main.py."
