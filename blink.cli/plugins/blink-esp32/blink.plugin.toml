# tinkr-esp32 plugin manifest
# Reference implementation of the first Tinkr hardware plugin.
# Evolved from tinkr.cli/tools/*.py — same NDJSON contract, packaged as a plugin.

[plugin]
name = "tinkr-esp32"
display_name = "ESP32 Family Support"
version = "0.4.2"
description = "ESP32, ESP32-S2/S3, ESP32-C3/C6, ESP32-C2 support via esptool and minny. The first Tinkr plugin — the reference implementation."
authors = ["Ronie Joseph <ronie@example.com>"]
license = "MIT"
homepage = "https://github.com/tinkr-registry/tinkr-esp32"
repository = "https://github.com/tinkr-registry/tinkr-esp32.git"

[provides]
families = ["esp32", "esp32s2", "esp32s3", "esp32c3", "esp32c6", "esp32c2"]
boards = [
    "ESP32-DevKitC",
    "ESP32-S3-DevKitC-1",
    "M5Stack-CoreS3",
    "NodeMCU-32S",
    "ESP32-C3-DevKitM-1",
    "ESP32-C6-DevKitC-1",
]
firmware_types = ["micropython", "circuitpython", "esp-idf", "arduino"]
transports = ["serial", "usb-native", "webrepl"]

[capabilities]
flash = true
repl = true
filesystem = true
package_manager = true
gdb = false
wifi_sim = false
logic_analyzer = false
ota_update = false
serial_plotter = true
custom_capabilities = [
    "esp32-deep-sleep",
    "esp32-ulp-coprogram",
    "esp32-efuse-read",
]

[dependencies]
tinkr = ">=0.2.0,<0.4.0"
python = ">=3.11"
packages = [
    "esptool>=5.2",
    "minny>=0.13",
    "pyserial>=3.4",
    "pydantic>=2.0",
]
optional_packages = [
    "pyocd>=1.0",  # Only for ESP32-C6 JTAG
]
plugins = []

[[tools]]
name = "tinkr-esp32-port-scan"
entry = "cli/tinkr_esp32_port_scan.py"
runtime = "python"
description = "Scan all serial ports for ESP32-family devices (VID/PID + text matching)"
tier = 1
requires_device = false
requires_port = false
streaming = false

[[tools]]
name = "tinkr-esp32-identify"
entry = "cli/tinkr_esp32_identify.py"
runtime = "python"
description = "Identify the exact chip on a connected ESP32 port"
tier = 1
requires_device = true
requires_port = true
streaming = false

[[tools]]
name = "tinkr-esp32-flash-firmware"
entry = "cli/tinkr_esp32_flash_firmware.py"
runtime = "python"
description = "Flash ESP32 firmware via esptool with progress streaming"
tier = 1
requires_device = true
requires_port = true
streaming = true

[[tools]]
name = "tinkr-esp32-repl-execute"
entry = "cli/tinkr_esp32_repl_execute.py"
runtime = "python"
description = "Execute Python code on the ESP32 via raw paste mode"
tier = 1
requires_device = true
requires_port = true
streaming = true

[[tools]]
name = "tinkr-esp32-fs-list"
entry = "cli/tinkr_esp32_fs_list.py"
runtime = "python"
description = "List files on the ESP32's internal filesystem"
tier = 2
requires_device = true
requires_port = true
streaming = false

[mcp]
tool_prefix = "esp32"

[knowledge]
chips = ["knowledge/chips/*.json"]
pinouts = ["knowledge/pinouts/*.json"]
datasheets = ["knowledge/datasheets/*.pdf"]
references = ["knowledge/references/*.md"]

[build]
test_command = "pytest tests/"
entry_test = "tests/test_smoke.py"

[compatibility]
tested_tinkr_versions = ["0.2.0", "0.3.0"]
tested_platforms = ["darwin", "linux", "win32"]
tested_python = ["3.11", "3.12", "3.13"]
maturity = "stable"
